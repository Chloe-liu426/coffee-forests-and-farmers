<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Germany is a major entry point for Europe's coffee</title>
  <desc id="desc">Horizontal bars compare five EU countries' coffee imports from outside the EU in 2025, in tonnes. Germany: 1,010,500; Italy: 608,000; Spain: 281,600; Belgium: 269,200; Netherlands: 216,600. The linear horizontal axis starts at zero. Germany is highlighted in orange. These are imports, not domestic consumption. Source: Eurostat, 1 October 2026, dataset ds-045409.</desc>
  <defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#183c32}.label{font-size:23px}.value{font-size:22px;font-weight:700}.tick{font-size:20px;fill:#53685e}.grid{stroke:#d4d9cb;stroke-width:1}</style></defs>
  <rect width="960" height="620" rx="18" fill="#f4f0e7"/>
  <text x="38" y="48" font-size="30" font-weight="700">Germany is a major entry point for Europe's coffee</text>
  <text x="38" y="84" font-size="22">Coffee imports from outside the EU · 2025 · tonnes</text>
  <g aria-hidden="true">
    <line class="grid" x1="218" y1="120" x2="218" y2="456"/>
    <line class="grid" x1="367.09" y1="120" x2="367.09" y2="456"/>
    <line class="grid" x1="516.18" y1="120" x2="516.18" y2="456"/>
    <line class="grid" x1="665.27" y1="120" x2="665.27" y2="456"/>
    <line class="grid" x1="814.36" y1="120" x2="814.36" y2="456"/>
  </g>
  <text class="label" x="194" y="154" text-anchor="end" font-weight="700">Germany</text>
  <rect x="218" y="128" width="602.625" height="39" rx="3" fill="#bb5b38"/>
  <text class="value" x="832" y="155">1,010,500</text>
  <text class="label" x="194" y="222" text-anchor="end">Italy</text>
  <rect x="218" y="196" width="362.589" height="39" rx="3" fill="#8b9f83"/>
  <text class="value" x="593" y="223">608,000</text>
  <text class="label" x="194" y="290" text-anchor="end">Spain</text>
  <rect x="218" y="264" width="167.936" height="39" rx="3" fill="#8b9f83"/>
  <text class="value" x="398" y="291">281,600</text>
  <text class="label" x="194" y="358" text-anchor="end">Belgium</text>
  <rect x="218" y="332" width="160.541" height="39" rx="3" fill="#8b9f83"/>
  <text class="value" x="391" y="359">269,200</text>
  <text class="label" x="194" y="426" text-anchor="end">Netherlands</text>
  <rect x="218" y="400" width="129.172" height="39" rx="3" fill="#8b9f83"/>
  <text class="value" x="360" y="427">216,600</text>
  <line x1="218" y1="456" x2="874" y2="456" stroke="#183c32" stroke-width="2"/>
  <g class="tick" text-anchor="middle"><text x="218" y="487">0</text><text x="367.09" y="487">250,000</text><text x="516.18" y="487">500,000</text><text x="665.27" y="487">750,000</text><text x="814.36" y="487">1,000,000</text></g>
  <text x="38" y="534" font-size="20">Selected member states. Imports can be processed or re-exported;</text>
  <text x="38" y="561" font-size="20">these figures do not measure what German households drink.</text>
  <text x="38" y="599" font-size="20" fill="#53685e">Source: Eurostat, 1 October 2026 · dataset ds-045409. Original chart.</text>
</svg>
