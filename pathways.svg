<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 750" role="img" aria-labelledby="title desc"><title id="title">Two responses to the same forest standard</title><desc id="desc">Conceptual pathways: supported evidence and stewardship may improve forest outcomes. Supplier avoidance can exclude farmers; leakage is conditional on displaced deforestation-linked supply or clearing. Not a forecast.</desc><rect width="960" height="750" fill="#f4f0e7"/><style>text{font-family:Arial,sans-serif;fill:#183c32}.head{font-size:28px;font-weight:700}.body{font-size:22px}.small{font-size:20px;fill:#53685d}</style><text x="40" y="55" class="head">One standard, two possible responses</text><text x="40" y="88" class="small">Original causal diagram • mechanisms to test, not measured outcomes</text><rect x="260" y="120" width="440" height="62" rx="6" fill="#183c32"/><text x="480" y="158" text-anchor="middle" style="fill:#fff;font-size:24px">EUDR evidence requirement</text><path d="M480 182V210H250V239M480 210H710V239" fill="none" stroke="#7f927e" stroke-width="3"/><text x="60" y="265" class="body" font-weight="700" style="fill:#183c32">INVEST IN INCLUSION</text><rect x="40" y="287" width="420" height="88" fill="#fffdf8" stroke="#d0d5c7" rx="5"/><text x="58" y="321" class="body" font-weight="700">Shared mapping + local checks</text><text x="58" y="352" class="small">Buyers and institutions help fund proof</text><path d="M250 375v23m-6-6 6 6 6-6" fill="none" stroke="#183c32" stroke-width="2"/><rect x="40" y="403" width="420" height="88" fill="#fffdf8" stroke="#d0d5c7" rx="5"/><text x="58" y="437" class="body" font-weight="700">Compliant smallholders retain access</text><text x="58" y="468" class="small">Clear records + viable purchasing terms</text><path d="M250 491v23m-6-6 6 6 6-6" fill="none" stroke="#183c32" stroke-width="2"/><rect x="40" y="519" width="420" height="88" fill="#fffdf8" stroke="#d0d5c7" rx="5"/><text x="58" y="553" class="body" font-weight="700">Potential conservation gains</text><text x="58" y="584" class="small">Depends on real land-use incentives</text><text x="520" y="265" class="body" font-weight="700" style="fill:#bb5b38">AVOID COST AND UNCERTAINTY</text><rect x="500" y="287" width="420" height="88" fill="#fffdf8" stroke="#d0d5c7" rx="5"/><text x="518" y="321" class="body" font-weight="700">Prefer easy-to-document suppliers</text><text x="518" y="352" class="small">Poor records can trigger buyer exit</text><path d="M710 375v23m-6-6 6 6 6-6" fill="none" stroke="#bb5b38" stroke-width="2"/><rect x="500" y="403" width="420" height="88" fill="#fffdf8" stroke="#d0d5c7" rx="5"/><text x="518" y="437" class="body" font-weight="700">Exclusion and trade diversion</text><text x="518" y="468" class="small">Lost EU access is not itself leakage</text><path d="M710 491v23m-6-6 6 6 6-6" fill="none" stroke="#bb5b38" stroke-width="2"/><rect x="500" y="519" width="420" height="88" fill="#fffdf8" stroke="#d0d5c7" rx="5"/><text x="518" y="553" class="body" font-weight="700">Potential environmental leakage</text><text x="518" y="584" class="small">If harmful supply or clearing shifts</text><text x="40" y="655" class="small">Neither pathway is automatic. Check both farmer inclusion and forest change.</text><text x="40" y="691" class="small">Sources: author’s synthesis of EU rules; ten Hove et al. (2025);</text><text x="40" y="720" class="small">Yarlagadda et al. (2025, oil-crop modelling; no coffee forecast).</text></svg>